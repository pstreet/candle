[package]
name = "cudarc-hip"
version.workspace = true
edition.workspace = true
description = "CUDA-compatible API surface over the HIP (ROCm) runtime, for use with candle."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
half = { workspace = true }
float8 = { workspace = true }
libloading = { version = "0.9.0", optional = true }

[features]
# Resolve every sys binding through a runtime dlopen (RTLD_LOCAL) instead of
# link-time dependencies - mirrors cudarc's dynamic-loading feature. With this
# on, the binary starts on machines with no ROCm installed at all; gate GPU use
# on driver::sys::is_culib_present(). Enabled by candle-core's `rocm` feature:
# every rocm build dlopens the driver. Off (for non-candle consumers) keeps
# dynamic-linking.
dynamic-loading = ["dep:libloading"]

[lib]
name = "cudarc_hip"
path = "src/lib.rs"
