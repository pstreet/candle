[package]
name = "candle-kernels"
version = "0.11.0"
edition = "2021"

description = "CUDA/ROCm kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[features]
default = []
# Build the kernels with the local ROCm/HIP toolchain (hipcc) instead of the
# CUDA toolchain (cudaforge/nvcc). Enabled via candle-core's `rocm` feature.
rocm = []
# Hot-pluggable kernels: link the hipcc objects into a companion shared
# library (dlopened at runtime) instead of the static archive. Enabled by
# candle-core's `rocm` feature: every rocm build consumes the companion
# .so; static kernel linking is gone (artifact portability is uniform).
hip-plugin = ["dep:libloading"]

[dependencies]
libloading = { version = "0.9", optional = true }

[build-dependencies]
cudaforge = "0.1.2"
