[package]
name = "candle-core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle-kernels = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
cudarc-hip = { workspace = true, optional = true }
candle-kernels-cuda = { path = "../candle-kernels-cuda", optional = true }
gemm = { workspace = true }
half = { workspace = true, features = ["zerocopy"] }
float8 = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true }
libm = { workspace = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
yoke = { workspace = true }
zerocopy = { workspace = true }
zip = { workspace = true }
parking_lot = "0.12.5"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["onig"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
candle-ug = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
half = { workspace = true }

[features]
default = []
# Combinations are plain feature sets: `--features cuda,rocm` is the
# multi-vendor build (no compound feature). `cuda_backend` is then the
# NVIDIA role (real cudarc + the PTX twin crate), `hip_backend` the AMD
# role. The twin crate is attached to `cuda` itself for monotone-feature
# reasons: in a cuda-only build it is compiled but unused (that shape
# serves JIT kernels from `candle-kernels`), which is the accepted cost of
# expressing AND-logic without a compound.
cuda = ["cudarc", "dep:candle-kernels", "dep:candle-kernels-cuda", "candle-ug?/cuda"]
# Every rocm build is portable: cudarc-hip dlopens the driver (the binary
# starts with no ROCm installed; GPU use stays gated on the
# is_culib_present() probes) and candle-kernels is consumed from the
# dlopened companion .so instead of a static archive. Single-vendor rocm
# used to link statically; the dual artifact's portability is now uniform.
rocm = [
    "dep:cudarc-hip",
    "cudarc-hip/dynamic-loading",
    "dep:candle-kernels",
    "candle-kernels/rocm",
    "candle-kernels/hip-plugin",
]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
    "candle-ug?/metal",
]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]
ug = ["dep:candle-ug"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "rocm_basics"
required-features = ["rocm"]
